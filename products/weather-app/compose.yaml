name: dayward
services:
  source:
    image: ghcr.io/open-meteo/open-meteo@sha256:e1517a01a061fd96e2a9017d022c5809bb51725bcd733bcbed435e7ea32dd9da
    environment:
      REMOTE_DATA_DIRECTORY: https://openmeteo.s3.amazonaws.com/data/
      CACHE_SIZE: 256MB
    tmpfs:
      - /app/data:rw,size=536870912,uid=999,gid=999,mode=0700
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: service/Dockerfile
    ports:
      - "${DAYWARD_BIND_ADDRESS:-127.0.0.1}:${DAYWARD_PORT:-8787}:8787"
    volumes:
      - forecasts:/data:ro
    restart: unless-stopped
  collector:
    build:
      context: .
      dockerfile: service/Dockerfile
    command: ["node", "service/worker.mjs"]
    environment:
      SOURCE_URL: http://source:8080
      PLACES: london,edinburgh,paris,berlin,new-york,san-francisco
      COLLECT_INTERVAL_SECONDS: 3600
    volumes:
      - forecasts:/data
    depends_on:
      - source
    restart: unless-stopped
volumes:
  forecasts:
